name = "polaris-next"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Required by OpenNext for internal Worker-to-Worker requests (ISR/revalidation).
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "polaris-next"

# TODO: add a custom domain route once one is configured in the Cloudflare
# dashboard (Workers & Pages -> polaris-next -> Settings -> Domains & Routes),
# then update REDIRECT_URI below (and the redirect URI registered with Polar)
# to match it. Until then this Worker is only reachable at its *.workers.dev URL.
# [[routes]]
# pattern = "your-custom-domain.com/*"
# custom_domain = true

# KV namespace for sessions
[[kv_namespaces]]
binding = "POLAR_SESSIONS"
id = "1f10cde899c847bcae5048beb3a29e0d"

[vars]
POLAR_CLIENT_ID = "9eab5c3c-33ae-41c0-a029-8f844033e8a3"
REDIRECT_URI = "https://polaris-6hn.pages.dev/en-gb/api/auth/callback"
